# SonarCloud Configuration
sonar.projectKey=contact-management
sonar.organization=your-organization-key
sonar.host.url=https://sonarcloud.io

# Path to source code
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src

# Language-specific settings
sonar.java.source=17
sonar.java.target=17
sonar.java.coveragePlugin=jacoco
sonar.java.jacoco.reportPaths=backend/target/jacoco/jacoco.xml
sonar.java.binaries=backend/target/classes

# Frontend (JavaScript/JSX)
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.coveragePlugin=v8
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
